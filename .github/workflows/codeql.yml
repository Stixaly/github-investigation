name: CodeQL

# Static security analysis of the Rust backend, the TypeScript frontend and the
# workflows themselves (script injection, over-broad tokens). Findings land in
# the Security tab; the job fails only if the analysis cannot run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Tests and fuzz targets hold attacker-shaped input on purpose.
          config: |
            paths-ignore:
              - crates/observatory/tests
              - crates/**/*_tests.rs
              - fuzz
              - frontend/src/**/*.test.ts
              - frontend/src/**/*.test.tsx
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
