name: Anomalie
description: Un comportement incorrect de l'API, du worker ou de l'interface.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Ne pas décrire ici une vulnérabilité : utiliser le signalement privé (voir SECURITY.md).
        Ne pas coller de secret, de jeton ni de donnée d'investigation réelle.
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
      description: Étapes, message affiché, extrait de `docker compose logs api worker` sans donnée sensible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version ou commit
      placeholder: "0.2.0 ou SHA"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Hôte
      placeholder: "Debian 13, AlmaLinux 10, Ubuntu/WSL…"
