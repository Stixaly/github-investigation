# Dependency updates arrive as pull requests and go through the full CI.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint declares TypeScript < 6.1 as its peer dependency:
      # move both together once it supports TypeScript 7 (same pin as CTIParsor).
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images pinned by digest in the Dockerfiles and compose files.
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Node stays on an LTS line, aligned with CI's setup-node: a major
      # (26 once it is LTS) is a deliberate change, not a weekly bump.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
