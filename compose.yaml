name: github-investigation

x-app: &app
  image: github-investigation:local
  build:
    context: .
    target: runtime
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=64m,mode=1777"]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  init: true
  networks: [backend]
  environment: &environment
    DB_HOST: postgres
    DB_NAME: investigation
    DB_USER: investigator
    DB_PASSWORD_FILE: /run/secrets/db_app
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
  secrets: [db_app]

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    user: postgres
    environment:
      POSTGRES_DB: investigation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
    secrets: [db_admin]
    volumes: [pgdata:/var/lib/postgresql]
    tmpfs: ["/tmp:size=64m", "/var/run/postgresql:size=16m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d investigation"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    environment:
      <<: *environment
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/db_admin
      APP_PASSWORD_FILE: /run/secrets/db_app
    secrets: [db_admin, db_app]
    command: [migrate]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    command: [serve]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8000"]
    networks: [backend, frontend]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    <<: *app
    command: [worker]
    environment:
      <<: *environment
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      GITHUB_MIN_INTERVAL_MS: ${GITHUB_MIN_INTERVAL_MS:-250}
      GITHUB_CACHE_FRESHNESS_SECONDS: ${GITHUB_CACHE_FRESHNESS_SECONDS:-600}
      GITHUB_CACHE_RETENTION_DAYS: ${GITHUB_CACHE_RETENTION_DAYS:-7}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    secrets: [db_app, github_token]
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 20s
    restart: unless-stopped

  # `make test`: Rust integration tests against a throwaway PostgreSQL.
  test:
    profiles: [test]
    image: github-investigation:test
    build: {context: ., target: test}
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    environment:
      TEST_DATABASE_URL: postgres://postgres:ephemeral-tests-only@test-postgres:5432/postgres
      REQUIRE_DB_TESTS: "1"
      RUST_LOG: warn
    depends_on:
      test-postgres: {condition: service_healthy}

  test-postgres:
    profiles: [test]
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_PASSWORD: ephemeral-tests-only
    tmpfs: [/var/lib/postgresql, /var/run/postgresql]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      retries: 20

networks:
  backend: {internal: true}
  frontend: {}
  egress: {}

volumes:
  pgdata: {}

secrets:
  db_admin: {file: ./.secrets/db_admin}
  db_app: {file: ./.secrets/db_app}
  github_token: {file: ./.secrets/github_token}
