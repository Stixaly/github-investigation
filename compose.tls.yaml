services:
  api:
    environment:
      # The gateway sets X-Real-IP; failed logins are then counted per analyst workstation.
      TRUST_PROXY_HEADERS: "1"

  gateway:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ports: ["${TLS_BIND_ADDRESS:-0.0.0.0}:${TLS_PORT:-8443}:8443"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z"]
    secrets: [tls_cert, tls_key]
    networks: [frontend]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
secrets:
  tls_cert: {file: ./.secrets/tls.crt}
  tls_key: {file: ./.secrets/tls.key}
